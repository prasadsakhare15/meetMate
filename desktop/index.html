<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meeting Copilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="window">

    <!-- LOGIN OVERLAY -->
    <div class="login-overlay" id="login-overlay">

        <div class="login-card">

            <div class="login-logo">✦</div>

            <div class="login-title">
                Sign in to Meeting Copilot
            </div>

            <div class="login-subtitle">
                Your account keeps meetings private to you.
            </div>

            <label class="field-label" for="login-username">
                Username
            </label>
            <input
                id="login-username"
                class="login-input"
                type="text"
                autocomplete="username"
                spellcheck="false"
            >

            <label class="field-label" id="label-password" for="login-password">
                Password
            </label>
            <input
                id="login-password"
                class="login-input"
                type="password"
                autocomplete="current-password"
            >

            <div id="new-password-container" style="display: none;">
                <label class="field-label" for="login-new-password" style="margin-top: 7px; display: block;">
                    New password
                </label>
                <input
                    id="login-new-password"
                    class="login-input"
                    type="password"
                    autocomplete="new-password"
                >
            </div>

            <div
                id="login-error"
                class="login-error"
            >
            </div>

            <button
                id="login-btn"
                class="login-btn"
            >
                Sign in
            </button>

            <div style="display: flex; gap: 8px;">
                <button
                    id="register-btn"
                    class="login-btn secondary"
                    style="flex: 1;"
                >
                    Create account
                </button>
                <button
                    id="show-change-password-btn"
                    class="login-btn secondary"
                    style="flex: 1;"
                >
                    Change password
                </button>
            </div>

            <div class="login-hint">
                Runs against your own cloud server.
            </div>

        </div>

    </div>

    <!-- HEADER -->
    <div class="header" id="drag-region">

        <div class="brand">
            <div class="logo">✦</div>

            <div>
                <div class="title">Meeting Copilot</div>

                <div class="status">
                    <span id="status-dot"></span>
                    <span id="status">Connecting...</span>
                </div>
            </div>
        </div>

        <div class="window-controls">

            <button id="collapse-btn" title="Collapse">
                −
            </button>

            <button id="close-btn" title="Close">
                ×
            </button>

        </div>

    </div>


    <!-- MAIN CONTENT -->
    <div class="content" id="content">

        <section class="setup-panel" id="setup-panel">

            <div class="section-label">AUDIO</div>

            <label class="field-label" for="output-select">
                Speakers / headphones
            </label>
            <select id="output-select" class="device-select">
                <option value="">Waiting for devices...</option>
            </select>

            <label class="field-label" for="mic-select">
                Microphone
            </label>
            <select id="mic-select" class="device-select">
                <option value="">Waiting for devices...</option>
            </select>

            <button id="capture-btn" class="capture-btn">
                Start meeting
            </button>

        </section>

        <!-- QUESTION -->
        <section class="section">

            <div class="section-label">
                <span>QUESTION</span>
            </div>

            <div
                id="question"
                class="question empty"
            >
                Listening for a question...
            </div>

        </section>


        <!-- ANSWER -->
        <section class="section answer-section">

            <div class="section-header">

                <span class="section-label">
                    SUGGESTED RESPONSE
                </span>

                <button
                    id="copy-btn"
                    class="small-btn"
                >
                    Copy
                </button>

            </div>

            <div
                id="answer"
                class="answer empty"
            >
                Your suggested response will appear here.
            </div>

        </section>


        <!-- FOLLOW UP -->
        <section class="section">

            <div class="section-label">
                FOLLOW-UP
            </div>

            <div
                id="followup"
                class="followup empty"
            >
                —
            </div>

        </section>


        <!-- KEY POINT -->
        <section class="section">

            <div class="section-label">
                KEY POINT
            </div>

            <div
                id="keypoint"
                class="keypoint empty"
            >
                —
            </div>

        </section>

    </div>


    <!-- FOOTER -->
    <div class="footer" id="footer">

        <button
            id="regenerate-btn"
            class="action-btn"
        >
            ↻ Regenerate
        </button>

        <span class="shortcut">
            Ctrl + Space
        </span>

    </div>

    <button id="helpButton" class="help-button">
    🚨 HELP ME
        <span>Ctrl + Space</span>
    </button>

</div>

<script src="renderer.js"></script>

</body>
</html>
